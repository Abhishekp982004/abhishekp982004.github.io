<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Existing CSS */
        body {
            background-color: white;
            color: black;
        }
        /* Theme toggle CSS */
        .theme-toggle {
            cursor: pointer;
        }
        html.dark {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <div class="header-icons">
            <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            <div class="search-icon">🔍</div>
        </div>
    </header>
    <main>
        <p>This is my content!</p>
        <!-- more content -->
    </main>
    <script>
        // Theme IIFE to read localStorage theme and toggle
        (() => {
            const themeToggleButton = document.querySelector('.theme-toggle');
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.toggle('dark', currentTheme === 'dark');

            themeToggleButton.addEventListener('click', () => {
                const newTheme = document.documentElement.classList.toggle('dark') ? 'dark' : 'light';
                localStorage.setItem('theme', newTheme);
                themeToggleButton.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });
            themeToggleButton.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Existing search script
            console.log('Search script loaded.');
        });
    </script>
</body>
</html>
